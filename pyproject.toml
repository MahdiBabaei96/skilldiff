[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skilldiff"
dynamic = ["version"]
description = "Before/after experiments that show whether adding or changing a Claude skill breaks the workflows you already rely on."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []
keywords = ["claude", "claude-code", "agent-skills", "regression-testing", "evals"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
skilldiff = "skilldiff.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.dynamic]
version = { attr = "skilldiff.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
